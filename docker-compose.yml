services:
  db:
    image: postgres:16-alpine
    container_name: bgr-brain-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: bgr
      POSTGRES_PASSWORD: bgrsecret
      POSTGRES_DB: bgrbrain
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bgr -d bgrbrain"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Production: derlenmiş Next.js sunucusu (hızlı). Günlük kullanım için bu.
  # Geliştirme (canlı yeniden yükleme) için: docker-compose.dev.yml override'ını ekleyin.
  app:
    build: ./frontend
    container_name: bgr-brain-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://bgr:bgrsecret@db:5432/bgrbrain?schema=public
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: production
      OLLAMA_URL: http://llm:11434
    ports:
      - "127.0.0.1:3000:3000"

  llm:
    image: ollama/ollama:latest
    container_name: bgr-brain-llm
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: [ "/bin/sh", "-c", "ollama serve & sleep 5 && ollama pull gemma2:2b && wait" ]

volumes:
  pgdata:
  node_modules:
  next_cache:
  ollama_data:
