services:
  db:
    image: postgres:16-alpine
    container_name: bgr-brain-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: bgr
      POSTGRES_PASSWORD: bgrsecret
      POSTGRES_DB: bgrbrain
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bgr -d bgrbrain"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Production: derlenmiş Next.js sunucusu (hızlı). Günlük kullanım için bu.
  # Geliştirme (canlı yeniden yükleme) için: docker-compose.dev.yml override'ını ekleyin.
  app:
    build: ./frontend
    container_name: bgr-brain-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://bgr:bgrsecret@db:5432/bgrbrain?schema=public
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: production
      # Ollama artık container değil, host makinede çalışıyor (macOS Docker Desktop).
      # 11434 değil 11435: bu makinede başka bir proje (gbzprj) 11434'ü zaten
      # kullanıyor, bu yüzden i40portal için ayrı bir Ollama instance'ı
      # (com.i40portal.ollama-dev launchd agent) 11435'te dinliyor.
      OLLAMA_URL: http://host.docker.internal:11435
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  pgdata:
  node_modules:
  next_cache:
