services:
  db:
    image: postgres:16-alpine
    container_name: bgr-brain-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: bgr
      POSTGRES_PASSWORD: bgrsecret
      POSTGRES_DB: bgrbrain
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bgr -d bgrbrain"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Production: derlenmiş Next.js sunucusu (hızlı). Günlük kullanım için bu.
  # Geliştirme (canlı yeniden yükleme) için: docker-compose.dev.yml override'ını ekleyin.
  app:
    build: ./frontend
    container_name: bgr-brain-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://bgr:bgrsecret@db:5432/bgrbrain?schema=public
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: production

      # ── "Bana Sor" lokal AI ayarları ────────────────────────────
      # Ollama HOSTTA çalışır, konteynerde değil. Sebebi: Docker Desktop
      # macOS'ta GPU'ya erişemez; hostta çalışan Ollama Metal GPU kullanır ve
      # aynı model belirgin biçimde daha hızlıdır.
      #
      # Kurulum: Ollama.app (ya da `ollama serve`) hostta 11434'te dinlemeli.
      #   ollama pull gemma4:e4b
      #   ollama pull embeddinggemma
      # Doğrulama: uygulamada /api/chat/health
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}

      # Sohbet modeli. Kurulu değilse aynı aileden veya kurulu en küçük
      # modele otomatik düşülür (bkz. /api/chat/health).
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma4:e4b}

      # Anlamsal arama. GPU'lu host kurulumunda açık olması güvenlidir.
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-embeddinggemma}

      # Context penceresi. Doğrudan bellek tüketir (KV cache) ve yanıt
      # süresini belirler. Hostta GPU ile gemma4:e4b yalnızca ~3.2 GB yer
      # kapladığı için 16384 rahatça sığar ve bağlama iki kat daha fazla
      # kayıt girer. Düşürmek yanıtı hızlandırır, kapsamı daraltır.
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-16384}
      OLLAMA_TEMPERATURE: ${OLLAMA_TEMPERATURE:-0.15}
      OLLAMA_TIMEOUT_MS: ${OLLAMA_TIMEOUT_MS:-600000}

      # Veri tazeliğinin en sık kaç ms'de bir kontrol edileceği.
      AI_FRESHNESS_CHECK_MS: ${AI_FRESHNESS_CHECK_MS:-3000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  pgdata:
  node_modules:
  next_cache:
